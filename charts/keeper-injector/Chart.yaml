apiVersion: v2
name: keeper-injector
description: Keeper Secrets Manager Kubernetes Injector - Inject secrets into pods at runtime
type: application
version: 0.11.3
appVersion: "0.11.3"
kubeVersion: ">=1.21.0-0"
home: https://www.keepersecurity.com
icon: https://keepersecurity.com/vault/images/keeper_icons/icon_rounded_256.png
sources:
  - https://github.com/Keeper-Security/helm-charts
  - https://github.com/Keeper-Security/keeper-k8s-injector
maintainers:
  - name: Keeper Security
    email: pam@keepersecurity.com
    url: https://www.keepersecurity.com
keywords:
  - keeper
  - secrets
  - secrets-management
  - kubernetes
  - injection
  - sidecar
  - security
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: MIT
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.keeper.io/secrets-manager/
    - name: Source Code
      url: https://github.com/Keeper-Security/keeper-k8s-injector
    - name: Examples
      url: https://github.com/Keeper-Security/keeper-k8s-injector/tree/main/examples
    - name: Support
      url: https://github.com/Keeper-Security/keeper-k8s-injector/issues
  artifacthub.io/changes: |
    - kind: security
      description: Reject a pod whose declared namespace disagrees with the admission request's namespace, closing a cross-namespace Secret read/write and an ExcludedNamespaces bypass
    - kind: security
      description: Stop returning the real mutation error to the webhook caller, closing a cross-namespace Secret-existence oracle
    - kind: security
      description: Return an error instead of panicking when a KSM config fails to initialize
    - kind: security
      description: Update google.golang.org/grpc to 1.82.1 (GHSA-hrxh-6v49-42gf)
    - kind: fixed
      description: Exclude the release namespace from the webhook's namespaceSelector so a fresh install can't deadlock on itself
