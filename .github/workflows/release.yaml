# Helm Charts Release Workflow
#
# WORKFLOW LOGIC:
#   - Pull Request: lint and validate charts
#   - Push to main: detect changed charts, package, and publish
#   - Manual run: republish the named charts to the Helm HTTP repository (gh-pages)
#     only, without pushing to OCI, e.g. to backfill a version whose index update failed
#
# PUBLISHED ARTIFACTS:
#   - Helm OCI: oci://registry-1.docker.io/keeper/<chart-name> (except keeper-gateway)
#   - Helm HTTP: https://keeper-security.github.io/helm-charts
#   - ArtifactHub: auto-syncs from GitHub Pages (deployed by pages.yaml)
#
# REQUIRED SECRETS (in prod environment):
#   - DOCKERHUB_USERNAME
#   - DOCKERHUB_TOKEN

name: Release Charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:
    inputs:
      charts:
        description: "Space-separated chart names to republish to gh-pages (no OCI push)"
        required: true

jobs:
  lint:
    name: Lint Charts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Lint charts
        run: |
          for chart in charts/*/; do
            if [ -f "${chart}/Chart.yaml" ]; then
              echo "Linting ${chart}..."
              helm lint "${chart}"
            fi
          done

      - name: Check README chart versions
        run: |
          status=0
          for chart in charts/*/; do
            if [ -f "${chart}/Chart.yaml" ]; then
              chart_name=$(basename "${chart}")
              version=$(grep '^version:' "${chart}/Chart.yaml" | awk '{print $2}')
              if ! grep -Eq "^\| \[${chart_name}\]\(.*\| ${version} \|$" README.md; then
                echo "::error file=README.md::${chart_name} is ${version} in Chart.yaml; update the chart table in README.md"
                status=1
              fi
            fi
          done
          exit "${status}"

      - name: Validate templates
        run: |
          for chart in charts/*/; do
            if [ -f "${chart}/Chart.yaml" ]; then
              echo "Validating ${chart}..."
              helm template test "${chart}" > /dev/null
            fi
          done

  release:
    name: Release Charts
    runs-on: ubuntu-24.04
    needs: [lint]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: prod
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Login to Docker Hub for Helm OCI
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Detect changed charts
        id: changed
        env:
          INPUT_CHARTS: ${{ inputs.charts }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            for chart_name in ${INPUT_CHARTS}; do
              if [[ ! "${chart_name}" =~ ^[a-z0-9-]+$ ]] || [ ! -f "charts/${chart_name}/Chart.yaml" ]; then
                echo "::error::unknown chart: ${chart_name}"
                exit 1
              fi
            done
            echo "charts=${INPUT_CHARTS}" >> "${GITHUB_OUTPUT}"
            echo "Republishing to gh-pages: ${INPUT_CHARTS}"
            exit 0
          fi
          CHANGED_CHARTS=""
          for chart in charts/*/; do
            if [ -f "${chart}/Chart.yaml" ]; then
              chart_name=$(basename "${chart}")
              if git diff --name-only HEAD~1 HEAD -- "${chart}" | grep -q .; then
                CHANGED_CHARTS="${CHANGED_CHARTS} ${chart_name}"
              fi
            fi
          done
          echo "charts=${CHANGED_CHARTS}" >> "${GITHUB_OUTPUT}"
          echo "Changed charts: ${CHANGED_CHARTS}"

      - name: Package and push changed charts
        if: steps.changed.outputs.charts != ''
        env:
          # keeper-gateway is distributed through the GitHub Pages Helm repository only
          OCI_SKIP_CHARTS: "keeper-gateway"
        run: |
          mkdir -p .helm-packages
          for chart_name in ${{ steps.changed.outputs.charts }}; do
            chart_dir="charts/${chart_name}"
            echo "=== Packaging ${chart_name} ==="
            helm package "${chart_dir}" -d .helm-packages

            version=$(grep '^version:' "${chart_dir}/Chart.yaml" | awk '{print $2}')
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "=== Manual run: skipping OCI push for ${chart_name} ==="
              continue
            fi
            if [[ " ${OCI_SKIP_CHARTS} " == *" ${chart_name} "* ]]; then
              echo "=== Skipping OCI push for ${chart_name} (Helm repository only) ==="
              continue
            fi
            echo "=== Pushing ${chart_name} v${version} to OCI ==="
            helm push ".helm-packages/${chart_name}-${version}.tgz" oci://registry-1.docker.io/keeper
          done

      - name: Checkout gh-pages branch
        if: steps.changed.outputs.charts != ''
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update Helm repository index
        if: steps.changed.outputs.charts != ''
        run: |
          cp .helm-packages/*.tgz gh-pages/ 2>/dev/null || true
          cd gh-pages
          helm repo index . --url https://keeper-security.github.io/helm-charts --merge index.yaml 2>/dev/null || helm repo index . --url https://keeper-security.github.io/helm-charts

      # The org ruleset requires verified signatures on gh-pages, and a plain `git push` from
      # the runner is unsigned. Commits created through the API with the workflow token are
      # signed by GitHub, so build the commit from blobs and a tree and move the ref.
      - name: Push to gh-pages
        if: steps.changed.outputs.charts != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          cd gh-pages
          git add -A
          if git diff --staged --quiet; then
            echo "Helm repository index unchanged"
            exit 0
          fi
          parent=$(git rev-parse HEAD)
          base_tree=$(git rev-parse "HEAD^{tree}")
          entries='[]'
          while IFS= read -r -d '' path; do
            if [ -f "${path}" ]; then
              sha=$(base64 -w0 "${path}" | jq -Rs '{content: ., encoding: "base64"}' \
                | gh api "repos/${REPO}/git/blobs" --input - --jq .sha)
              entries=$(jq -c --arg p "${path}" --arg s "${sha}" '. + [{path: $p, mode: "100644", type: "blob", sha: $s}]' <<<"${entries}")
            else
              entries=$(jq -c --arg p "${path}" '. + [{path: $p, mode: "100644", type: "blob", sha: null}]' <<<"${entries}")
            fi
          done < <(git diff --staged --name-only -z)
          tree=$(jq -n --arg b "${base_tree}" --argjson t "${entries}" '{base_tree: $b, tree: $t}' \
            | gh api "repos/${REPO}/git/trees" --input - --jq .sha)
          commit=$(jq -n --arg t "${tree}" --arg p "${parent}" '{message: "Update Helm repository index", tree: $t, parents: [$p]}' \
            | gh api "repos/${REPO}/git/commits" --input - --jq .sha)
          gh api -X PATCH "repos/${REPO}/git/refs/heads/gh-pages" -f sha="${commit}" -F force=false > /dev/null
          echo "gh-pages -> ${commit} (verified: $(gh api "repos/${REPO}/commits/${commit}" --jq .commit.verification.verified))"
